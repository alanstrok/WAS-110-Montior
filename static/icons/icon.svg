<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sfp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
    <linearGradient id="fiber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- SFP+ Module Body -->
  <rect x="80" y="160" width="280" height="192" rx="16" fill="url(#sfp)"/>

  <!-- Module Top Detail -->
  <rect x="80" y="160" width="280" height="40" rx="16" fill="#94a3b8"/>
  <rect x="80" y="180" width="280" height="20" fill="#94a3b8"/>

  <!-- Latch/Handle -->
  <rect x="100" y="140" width="60" height="30" rx="6" fill="#f59e0b"/>
  <rect x="105" y="145" width="50" height="8" rx="3" fill="#fbbf24"/>

  <!-- Fiber Connector (SC/APC style) -->
  <rect x="360" y="200" width="72" height="112" rx="8" fill="#22c55e"/>
  <rect x="370" y="210" width="52" height="92" rx="4" fill="#16a34a"/>
  <circle cx="396" cy="256" r="20" fill="#0f172a"/>
  <circle cx="396" cy="256" r="12" fill="#22c55e"/>
  <circle cx="396" cy="256" r="6" fill="#bbf7d0"/>

  <!-- Light Rays -->
  <g fill="none" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="432" y1="256" x2="470" y2="256"/>
    <line x1="432" y1="240" x2="460" y2="220"/>
    <line x1="432" y1="272" x2="460" y2="292"/>
  </g>

  <!-- Status LEDs -->
  <circle cx="120" cy="320" r="12" fill="#22c55e"/>
  <circle cx="160" cy="320" r="12" fill="#3b82f6"/>

  <!-- Model Text -->
  <text x="220" y="290" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#f1f5f9" text-anchor="middle">110</text>

  <!-- XGS-PON indicator -->
  <rect x="100" y="370" width="80" height="24" rx="4" fill="#1e293b"/>
  <text x="140" y="388" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e" text-anchor="middle">XGS-PON</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sfp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
  </defs>

  <!-- SFP+ Module Body -->
  <rect x="40" y="120" width="320" height="220" rx="20" fill="url(#sfp)"/>

  <!-- Module Top Detail -->
  <rect x="40" y="120" width="320" height="50" rx="20" fill="#94a3b8"/>
  <rect x="40" y="145" width="320" height="25" fill="#94a3b8"/>

  <!-- Latch/Handle -->
  <rect x="65" y="95" width="80" height="35" rx="8" fill="#f59e0b"/>
  <rect x="72" y="102" width="66" height="10" rx="4" fill="#fbbf24"/>

  <!-- Fiber Connector (SC/APC style - green for APC) -->
  <rect x="360" y="165" width="90" height="130" rx="12" fill="#22c55e"/>
  <rect x="372" y="177" width="66" height="106" rx="6" fill="#16a34a"/>
  <circle cx="405" cy="230" r="26" fill="#0f172a"/>
  <circle cx="405" cy="230" r="16" fill="#22c55e"/>
  <circle cx="405" cy="230" r="8" fill="#bbf7d0"/>

  <!-- Light Rays -->
  <g fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round">
    <line x1="450" y1="230" x2="495" y2="230"/>
    <line x1="450" y1="208" x2="485" y2="185"/>
    <line x1="450" y1="252" x2="485" y2="275"/>
  </g>

  <!-- Status LEDs -->
  <circle cx="85" cy="295" r="14" fill="#22c55e"/>
  <circle cx="130" cy="295" r="14" fill="#3b82f6"/>

  <!-- Model Number -->
  <text x="230" y="270" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#f1f5f9" text-anchor="middle">110</text>

  <!-- XGS-PON Badge -->
  <rect x="60" y="345" width="100" height="30" rx="6" fill="#1e293b"/>
  <text x="110" y="367" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#22c55e" text-anchor="middle">XGS-PON</text>

  <!-- WAS text -->
  <text x="290" y="365" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#94a3b8" text-anchor="middle">WAS</text>
</svg>

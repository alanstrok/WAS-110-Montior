<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WAS-110 Monitor</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="/static/icons/icon.svg" alt="WAS-110" class="logo-icon">
                <span>WAS-110</span>
            </div>
            <div class="header-actions">
                <div id="connection-badge" class="connection-badge disconnected">
                    <span class="status-dot pulse"></span>
                    <span class="desktop-only">Connecting</span>
                </div>
                <button id="refresh-btn" class="icon-btn" title="Refresh">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                    </svg>
                </button>
                <button id="theme-btn" class="icon-btn" title="Toggle theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
                <a href="/settings" class="icon-btn desktop-only" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="main">
        <!-- System Info -->
        <div class="system-info">
            <div class="info-item">
                <span class="info-label">PON</span>
                <span class="info-value" id="info-pon">--</span>
            </div>
            <div class="info-item">
                <span class="info-label">State</span>
                <span class="info-value" id="info-state">--</span>
            </div>
            <div class="info-item">
                <span class="info-label">Updated</span>
                <span class="info-value" id="info-updated">--</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card" id="card-temp1">
                <div class="stat-header">
                    <span class="stat-title">CPU 0</span>
                    <span class="stat-icon">🌡️</span>
                </div>
                <div class="stat-value" id="val-temp1">--<span class="unit">°C</span></div>
            </div>
            <div class="stat-card" id="card-temp2">
                <div class="stat-header">
                    <span class="stat-title">CPU 1</span>
                    <span class="stat-icon">🌡️</span>
                </div>
                <div class="stat-value" id="val-temp2">--<span class="unit">°C</span></div>
            </div>
            <div class="stat-card" id="card-optical">
                <div class="stat-header">
                    <span class="stat-title">Optical</span>
                    <span class="stat-icon">💎</span>
                </div>
                <div class="stat-value" id="val-optical">--<span class="unit">°C</span></div>
            </div>
            <div class="stat-card" id="card-voltage">
                <div class="stat-header">
                    <span class="stat-title">Voltage</span>
                    <span class="stat-icon">⚡</span>
                </div>
                <div class="stat-value" id="val-voltage">--<span class="unit">V</span></div>
            </div>
            <div class="stat-card" id="card-tx">
                <div class="stat-header">
                    <span class="stat-title">TX Power</span>
                    <span class="stat-icon">📤</span>
                </div>
                <div class="stat-value" id="val-tx">--<span class="unit">dBm</span></div>
            </div>
            <div class="stat-card" id="card-rx">
                <div class="stat-header">
                    <span class="stat-title">RX Power</span>
                    <span class="stat-icon">📥</span>
                </div>
                <div class="stat-value" id="val-rx">--<span class="unit">dBm</span></div>
            </div>
            <div class="stat-card" id="card-bias">
                <div class="stat-header">
                    <span class="stat-title">Bias</span>
                    <span class="stat-icon">🔌</span>
                </div>
                <div class="stat-value" id="val-bias">--<span class="unit">mA</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">Refresh</span>
                    <span class="stat-icon">⏱️</span>
                </div>
                <div class="stat-value" id="val-refresh">--</div>
            </div>
        </div>

        <!-- Charts -->
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">📊 History</h2>
                <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
                    <div class="time-range">
                        <button class="time-btn" data-hours="1">1h</button>
                        <button class="time-btn" data-hours="6">6h</button>
                        <button class="time-btn active" data-hours="24">24h</button>
                        <button class="time-btn" data-hours="48">48h</button>
                        <button class="time-btn" data-hours="72">3d</button>
                        <button class="time-btn" data-hours="168">7d</button>
                    </div>
                    <button id="reset-zoom-btn" class="btn-small" title="Reset chart zoom">Reset</button>
                </div>
            </div>
            <div class="charts-grid">
                <div class="chart-card">
                    <h3 class="chart-title">🌡️ Temperatures</h3>
                    <div class="chart-container"><canvas id="chart-temp"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3 class="chart-title">📡 Optical Power</h3>
                    <div class="chart-container"><canvas id="chart-power"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3 class="chart-title">⚡ Voltage</h3>
                    <div class="chart-container"><canvas id="chart-voltage"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3 class="chart-title">🔌 Bias Current</h3>
                    <div class="chart-container"><canvas id="chart-bias"></canvas></div>
                </div>
            </div>
        </section>

        <!-- Alerts -->
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">🔔 Alerts</h2>
                <button id="reset-alerts-btn" class="btn-small" title="Clear all alerts">Reset</button>
            </div>
            <div class="alerts-list" id="alerts-list">
                <div class="no-alerts">No recent alerts</div>
            </div>
        </section>
    </main>

    <!-- Bottom Nav (Mobile) -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Dashboard
        </a>
        <a href="/settings" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
            Settings
        </a>
    </nav>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="/static/js/app.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(console.error);
        }
    </script>
</body>
</html>
